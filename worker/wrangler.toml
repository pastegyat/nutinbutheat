name = "nutinbutheat-api"
main = "src/index.ts"
compatibility_date = "2026-08-18"

[[r2_buckets]]
binding = "POST_IMAGES"
bucket_name = "store"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "none"

[vars]
APPWRITE_ENDPOINT = "https://sfo.cloud.appwrite.io/v1"
APPWRITE_PROJECT_ID = "6a850db700193ddf2d05"
APPWRITE_DATABASE_ID = "6a850dcd0017f990a16d"
APPWRITE_POSTS_COLLECTION_ID = "6a850ddf00174115c6b6"
APPWRITE_REACTIONS_COLLECTION_ID = "6a850fa30007a0b84fd6"
APPWRITE_POST_EVENTS_COLLECTION_ID = "6a85104400352a7af475"
APPWRITE_ANALYTICS_COLLECTION_ID = "analytics"
APPWRITE_ALBUMS_COLLECTION_ID = "6a88e4c1003524ebfb51"
APPWRITE_ALBUM_ITEMS_COLLECTION_ID = "6a88e6cb0021907c0ef1"
APPWRITE_CONTACT_COLLECTION_ID = "contact_messages"
# Secrets (set via: wrangler secret put <NAME>): APPWRITE_API_KEY, ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_TOKEN_SECRET, IP_HASH_SECRET, TURNSTILE_SECRET
R2_PUBLIC_BASE_URL = "https://images.nutinbutheat.com"
